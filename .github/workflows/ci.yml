# The gate, on both platforms, on every push and pull request.
#
# One interpreter (3.12, the package's floor), one pinned uv (the version
# the group's agents ran the local gates with), and the spec's gate lines:
# pytest, framebench, the semantic check and the two piped demo runs.  The
# lines a shell would spell differently are the redirect (``< /dev/null`` /
# ``< NUL``) and the framebench pipe (its output kept in the log while the
# hash line is checked), so those two steps carry a small ``python -c``
# wrapper instead of branching on ``runner.os``: one spelling, every shell.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: uv, pinned to the dev toolchain
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.21"

      - name: install -- the lock is the dependency set, CI does not drift it
        run: uv sync --locked

      - name: ruff
        run: uv run ruff check .

      - name: ruff -- the PixelCanvas adapter (widgets tree still on the ratchet)
        run: uv run ruff check src/motui/widgets/pixel_canvas.py tests/widgets/test_pixel_canvas.py --config "exclude=[]"

      - name: pyright
        run: uv run pyright

      - name: import-linter
        run: uv run lint-imports

      - name: pytest
        run: uv run pytest -q

      - name: framebench -- exit 0 and the render-hash line present
        # The digest's *value* is not asserted: it is a property of the
        # machine's rendering, and a moved hash is a finding for a human,
        # not a red CI.  The exit code and the line's presence are asserted.
        run: |
          uv run python -c "import re, subprocess, sys; done = subprocess.run([sys.executable, 'tools/framebench.py'], capture_output=True, text=True); sys.stdout.write(done.stdout); sys.stderr.write(done.stderr); raise SystemExit(0 if done.returncode == 0 and re.search(r'^render-hash  : [0-9a-f]{64}$', done.stdout, re.M) else 1)"

      - name: semantic frames -- grid, attributes and cursor
        run: uv run python tools/semantic.py --check

      - name: api snapshot
        run: uv run python tools/api.py --check

      - name: growth
        run: uv run python tools/growth.py

      - name: demo -- the piped replay, stdin on the null device
        # ``< /dev/null`` is bash's spelling and ``< NUL`` is cmd's;
        # PowerShell has no redirection operator at all.  The wrapper is the
        # one spelling all three shells run, so the step needs no branch.
        run: |
          uv run python -c "import subprocess, sys; raise SystemExit(subprocess.run([sys.executable, '-m', 'motui'], stdin=subprocess.DEVNULL).returncode)"

      - name: demo -- every page dumped
        run: uv run python -m motui --pages

      - name: demo -- dashboard replay
        run: uv run python -m motui --scene dashboard --frames 30 --headless

      - name: demo -- snake replay
        run: uv run python -m motui --scene snake --frames 30 --headless

      - name: demo -- components replay
        run: uv run python -m motui --scene components --frames 12 --headless
