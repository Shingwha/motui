[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motui"
version = "2.1.2"
description = "A layered full-screen TUI toolkit for Python with the Ink & Signal theme: alternate-screen rendering, addressable blocks, viewport scrollback, role-based theming, configurable keymaps, and a pointer-aware widget library (wcwidth-only)."
readme = "README.md"
requires-python = ">= 3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shingwha" }]
keywords = [
    "tui",
    "terminal",
    "text-ui",
    "console",
    "widgets",
    "alt-screen",
    "markdown",
    "python",
    "ink-and-signal",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    "wcwidth>=0.2",
]

[project.urls]
Homepage = "https://github.com/Shingwha/motui"
Repository = "https://github.com/Shingwha/motui"
Issues = "https://github.com/Shingwha/motui/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.4",
    "ruff>=0.8",
    "pyright>=1.1.400",
    "import-linter>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/motui"]

[tool.hatch.build.targets.sdist]
exclude = ["/specs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The 2.1.2 lint wave removed the widget/app/test tree excludes; only the
# historical spec probes stay out of the check (they are not shipped source).
exclude = ["specs", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Narrow, intentional exceptions only.
"src/motui/kernel/text.py" = ["E501"]  # generated Unicode mark ranges
"src/motui/kernel/theme.py" = ["RUF009"]  # frozen Style tokens are values, not factories
"src/motui/kernel/cell.py" = ["RUF009"]
"src/motui/kernel/glyphs.py" = ["RUF009"]
"src/motui/kernel/selection.py" = ["B008"]  # public default Style(reverse=True)
"tools/framebench.py" = ["E402", "F401"]  # sys.path bootstrap and the probe import

[tool.pyright]
include = [
    "src/motui/kernel",
    "src/motui/pixel",
    "src/motui/testing",
    "src/motui/widgets/pixel_canvas.py",
    "tools",
]
# The benchmark tool is a pinned file; its wave is later.
ignore = ["tools/framebench.py"]
# The migrated 1.x kernel code is checked at basic; W0b's strict files stay
# strict, and W2/W3 tighten the migrated modules as they rewrite them.
typeCheckingMode = "basic"
strict = [
    "src/motui/kernel/geom.py",
    "src/motui/pixel",
    "src/motui/testing",
    "tools/api.py",
    "tools/growth.py",
]
pythonVersion = "3.12"

[tool.importlinter]
root_package = "motui"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "kernel has no I/O"
type = "forbidden"
source_modules = ["motui.kernel"]
forbidden_modules = [
    "os",
    "sys",
    "io",
    "ctypes",
    "termios",
    "tty",
    "select",
    "asyncio",
]

[[tool.importlinter.contracts]]
name = "kernel is a leaf"
type = "forbidden"
source_modules = ["motui.kernel"]
forbidden_modules = [
    "motui.pixel",
    "motui.widgets",
    "motui.app",
    "motui.terminal",
    "motui.testing",
]

[[tool.importlinter.contracts]]
name = "pixel depends only on the kernel"
type = "forbidden"
source_modules = ["motui.pixel"]
forbidden_modules = [
    "motui.widgets",
    "motui.app",
    "motui.terminal",
    "motui.testing",
]

[[tool.importlinter.contracts]]
name = "widgets may not import terminal or app"
type = "forbidden"
source_modules = ["motui.widgets"]
forbidden_modules = ["motui.terminal", "motui.app"]

[[tool.importlinter.contracts]]
name = "terminal may not import widgets, app or pixel"
type = "forbidden"
source_modules = ["motui.terminal"]
forbidden_modules = ["motui.widgets", "motui.app", "motui.pixel"]
