[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motui"
version = "1.2.3"
description = "A layered full-screen TUI toolkit for Python with the Ink & Signal theme: alternate-screen rendering, addressable blocks, viewport scrollback, role-based theming, configurable keymaps, and a pointer-aware widget library (wcwidth-only)."
readme = "README.md"
requires-python = ">= 3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shingwha" }]
keywords = [
    "tui",
    "terminal",
    "text-ui",
    "console",
    "widgets",
    "alt-screen",
    "markdown",
    "python",
    "ink-and-signal",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    "wcwidth>=0.2",
]

[project.urls]
Homepage = "https://github.com/Shingwha/motui"
Repository = "https://github.com/Shingwha/motui"
Issues = "https://github.com/Shingwha/motui/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.4",
    "ruff>=0.8",
    "pyright>=1.1.400",
    "import-linter>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/motui"]

[tool.hatch.build.targets.sdist]
exclude = ["/specs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ratchet: the 1.x tree is not lint-clean yet and W0 does not rewrite it.  The
# 2.0 waves remove these entries as they touch each tree (see W0b handoff).
exclude = [
    "specs",
    "src/motui/core",
    "src/motui/widgets",
    "src/motui/app",
    "src/motui/demo",
    "src/motui/__init__.py",
    "tests/core",
    "tests/widgets",
    "tests/app",
    "tests/golden",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 1.x files whose wave has not landed yet: one rule each, not a tree exclude.
"tests/kernel/test_surface.py" = ["I001"]
"tests/testing/clock.py" = ["UP037"]
"tests/test_invariants.py" = ["I001", "E501"]
"tools/framebench.py" = ["E402", "F401", "I001"]

[tool.pyright]
include = ["src/motui/kernel", "src/motui/testing", "tools"]
# The two 1.x benchmark/golden tools are pinned files; their wave is later.
ignore = ["tools/golden.py", "tools/framebench.py"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.importlinter]
root_package = "motui"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "kernel has no I/O"
type = "forbidden"
source_modules = ["motui.kernel"]
forbidden_modules = [
    "os",
    "sys",
    "io",
    "ctypes",
    "termios",
    "tty",
    "select",
    "asyncio",
]

[[tool.importlinter.contracts]]
name = "kernel is a leaf"
type = "forbidden"
source_modules = ["motui.kernel"]
forbidden_modules = ["motui.core", "motui.widgets", "motui.app", "motui.terminal"]
