[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motui"
version = "2.0.0"
description = "A layered full-screen TUI toolkit for Python with the Ink & Signal theme: alternate-screen rendering, addressable blocks, viewport scrollback, role-based theming, configurable keymaps, and a pointer-aware widget library (wcwidth-only)."
readme = "README.md"
requires-python = ">= 3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shingwha" }]
keywords = [
    "tui",
    "terminal",
    "text-ui",
    "console",
    "widgets",
    "alt-screen",
    "markdown",
    "python",
    "ink-and-signal",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    "wcwidth>=0.2",
]

[project.urls]
Homepage = "https://github.com/Shingwha/motui"
Repository = "https://github.com/Shingwha/motui"
Issues = "https://github.com/Shingwha/motui/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.4",
    "ruff>=0.8",
    "pyright>=1.1.400",
    "import-linter>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/motui"]

[tool.hatch.build.targets.sdist]
exclude = ["/specs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ratchet: the 1.x tree is not lint-clean yet.  Each 2.0 wave removes the
# entries it has cleaned; see the W0b and W1 handoffs.
exclude = [
    "specs",
    "src/motui/widgets",
    "src/motui/app",
    "src/motui/demo",
    "src/motui/__init__.py",
    "tests/widgets",
    "tests/app",
    "tests/terminal",
    "tests/golden",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 1.x files the kernel migration moved without rewriting their prose/tables.
# Each entry is one rule, not a tree exclude; later waves remove them.
"src/motui/kernel/text.py" = ["E501"]  # generated Unicode mark ranges
"src/motui/kernel/theme.py" = ["RUF009"]  # frozen Style tokens are values, not factories
"src/motui/kernel/cell.py" = ["RUF009"]
"src/motui/kernel/glyphs.py" = ["RUF009"]
"src/motui/kernel/frame.py" = ["E501", "RUF005"]
"src/motui/kernel/selection.py" = ["B008"]  # public default Style(reverse=True)
"tests/kernel/test_frame.py" = ["B023", "B905", "E501", "RUF015", "RUF059"]
"tests/kernel/test_text.py" = ["E402", "E501"]
"tests/kernel/test_layout.py" = ["F841"]
"tests/kernel/test_events.py" = ["E501"]
"tests/kernel/test_style.py" = ["B017"]
"tests/test_invariants.py" = ["I001", "E501"]
"tools/framebench.py" = ["E402", "F401", "I001"]

[tool.pyright]
include = ["src/motui/kernel", "src/motui/testing", "tools"]
# The two 1.x benchmark/golden tools are pinned files; their wave is later.
ignore = ["tools/golden.py", "tools/framebench.py"]
# The migrated 1.x kernel code is checked at basic; W0b's strict files stay
# strict, and W2/W3 tighten the migrated modules as they rewrite them.
typeCheckingMode = "basic"
strict = [
    "src/motui/kernel/geom.py",
    "src/motui/testing",
    "tools/api.py",
    "tools/growth.py",
]
pythonVersion = "3.12"

[tool.importlinter]
root_package = "motui"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "kernel has no I/O"
type = "forbidden"
source_modules = ["motui.kernel"]
forbidden_modules = [
    "os",
    "sys",
    "io",
    "ctypes",
    "termios",
    "tty",
    "select",
    "asyncio",
]

[[tool.importlinter.contracts]]
name = "kernel is a leaf"
type = "forbidden"
source_modules = ["motui.kernel"]
forbidden_modules = ["motui.widgets", "motui.app", "motui.terminal", "motui.testing"]

[[tool.importlinter.contracts]]
name = "widgets may not import terminal or app"
type = "forbidden"
source_modules = ["motui.widgets"]
forbidden_modules = ["motui.terminal", "motui.app"]

[[tool.importlinter.contracts]]
name = "terminal may not import widgets or app"
type = "forbidden"
source_modules = ["motui.terminal"]
forbidden_modules = ["motui.widgets", "motui.app"]
