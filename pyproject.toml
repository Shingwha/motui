[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motui"
version = "1.1.6"
description = "A layered full-screen TUI toolkit for Python: alternate-screen rendering, addressable blocks, viewport scrollback, themeable components, configurable keymaps, and a pointer-aware widget library (wcwidth-only)."
readme = "README.md"
requires-python = ">= 3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shingwha" }]
keywords = [
    "tui",
    "terminal",
    "text-ui",
    "console",
    "widgets",
    "alt-screen",
    "markdown",
    "python",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    "wcwidth>=0.2",
]

[project.urls]
Homepage = "https://github.com/Shingwha/motui"
Repository = "https://github.com/Shingwha/motui"
Issues = "https://github.com/Shingwha/motui/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/motui"]

[tool.hatch.build.targets.sdist]
exclude = ["/specs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
